<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resume — Inusah Abdul Aziz, Frontend Developer with NOCTI Certification in Web Development from DTI. Skills: HTML, CSS, JavaScript, React, Node.js.">
  <meta property="og:title" content="Resume — Abdul Aziz Inusah">
  <meta property="og:description" content="Frontend Developer resume — NOCTI Certification in Web Development, DTI. Projects in educational platforms, corporate sites, and interactive apps.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://abdulaziz-cyber395.github.io/my-portfolio/resume.html">
  <meta name="theme-color" content="#060a08">
  <link rel="canonical" href="https://abdulaziz-cyber395.github.io/my-portfolio/resume.html">
  <title>Resume — Abdul Aziz Inusah</title>
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <style>
    .resume-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }
    .resume-header {
      text-align: center;
      padding-bottom: 2rem;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 2rem;
      position: relative;
    }
    .resume-header::after {
      content: "";
      display: block;
      width: 60px;
      height: 2px;
      background: var(--accent);
      margin: 1rem auto 0;
      opacity: 0.5;
    }
    .resume-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }
    .resume-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }
    .resume-contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .resume-contact a {
      color: var(--accent);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .resume-contact a:hover {
      text-decoration: underline;
    }
    .resume-contact span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
    }
    .resume-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 0.25rem;
    }
    .resume-section {
      margin-bottom: 2.25rem;
    }
    .resume-section h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .resume-section h3 i {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    .resume-item {
      margin-bottom: 1.1rem;
    }
    .resume-item:last-child {
      margin-bottom: 0;
    }
    .resume-item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .resume-item-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .resume-item-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }
    .resume-item-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .resume-item p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.65;
      margin-bottom: 0.5rem;
    }
    .resume-skills-group {
      margin-bottom: 1.25rem;
    }
    .resume-skills-group:last-child {
      margin-bottom: 0;
    }
    .resume-skills-heading {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .resume-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .resume-skill-tag {
      padding: 0.3rem 0.65rem;
      border: 1px solid rgba(110, 231, 183, 0.2);
      border-radius: 999px;
      background: rgba(110, 231, 183, 0.06);
      color: #a7f3d0;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .resume-skill-learning {
      border-color: rgba(251, 191, 36, 0.25);
      background: rgba(251, 191, 36, 0.06);
      color: #fcd34d;
    }
    .resume-skill-soft {
      border-color: rgba(147, 197, 253, 0.25);
      background: rgba(147, 197, 253, 0.06);
      color: #bfdbfe;
    }
    .resume-project-techs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }
    .resume-project-tech {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .resume-project-separator {
      color: var(--text-muted);
      margin: 0 0.25rem;
    }
    .resume-project-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .resume-project-link:hover {
      text-decoration: underline;
    }
    .resume-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .resume-empty {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }
    .resume-empty code {
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    @media print {
      .resume-actions, .navbar, .back-to-top, .cursor-dot, .cursor-ring {
        display: none !important;
      }
      body {
        background: white !important;
        color: #1a1a1a !important;
      }
      .resume-container {
        max-width: 100%;
        padding: 0;
      }
      .resume-header {
        border-bottom-color: #333;
      }
      .resume-section h3 {
        border-bottom-color: #ddd;
        color: #444;
      }
      .resume-skill-tag {
        border-color: #d1d5db;
        background: #f3f4f6;
        color: #374151;
      }
      .resume-skill-learning {
        border-color: #fde68a;
        background: #fffbeb;
        color: #92400e;
      }
      .resume-skill-soft {
        border-color: #bfdbfe;
        background: #eff6ff;
        color: #1e40af;
      }
      .resume-project-tech {
        background: #f3f4f6;
        border-color: #e5e7eb;
        color: #4b5563;
      }
      .resume-project-link {
        color: #2563eb;
      }
      a {
        text-decoration: none;
        color: inherit !important;
      }
    }
    @media (max-width: 580px) {
      .resume-container {
        padding: 1.5rem 1rem;
      }
      .resume-header h1 {
        font-size: 1.55rem;
      }
      .resume-header h2 {
        font-size: 0.95rem;
      }
      .resume-contact {
        flex-direction: column;
        gap: 0.4rem;
        align-items: center;
      }
    }
  </style>
</head>

    <div class="main-wrapper">

      <div class="resume-actions">
        <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
        <button onclick="window.print()" class="btn btn-primary"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
      </div>

      <div class="resume-container">
        <div id="resume-header" class="resume-header"></div>

        <div class="resume-section">
          <div id="resume-summary"></div>
        </div>

        <div class="resume-section">
          <div id="resume-skills"></div>
        </div>

        <div class="resume-section">
          <div id="resume-projects"></div>
        </div>

        <div class="resume-section">
          <div id="resume-education"></div>
        </div>
      </div>

    </div>
  </main>
  <script src="js/projects-data.js"></script>
  <script src="js/resume-data.js"></script>
  <script src="js/resume.js"></script>
</body>
</html>
